[package]
name = "picoboot_host"
version = "0.1.0"
authors = ["Roman Isaikin <romix.lab@gmail.com>"]
description = "PICOBOOT host for the RP2350 / RP2040 boot ROM in Rust on nusb: flash UF2 or binary images, query, reboot"
edition = "2024"
license = "MIT"
repository = "https://github.com/vhrdtech/picoboot_host"
keywords = ["rp2350", "picoboot", "bootsel", "usb", "picotool"]

[features]
default = ["usb"]
# Real devices through nusb
usb = ["dep:nusb", "dep:tokio"]
# Simulated RP2350 boot ROM for tests
sim = []

[dependencies]
nusb = { version = "0.2", features = ["tokio"], optional = true }
thiserror = "2"
tokio = { version = "1", features = ["time"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
